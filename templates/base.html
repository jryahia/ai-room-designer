<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Room Designer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23C9A86A%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 10.5 12 3l9 7.5V21H3z%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head_extra %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span class="nav-icon"><i data-lucide="house" class="icon"></i></span>
      <span class="nav-title">AI Room Designer</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">New Design / Nuovo Progetto</a>
      <a href="/api/stats" class="nav-link" target="_blank">Stats</a>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>
        <strong>AI Room Designer</strong> — Powered by GPT-4o &amp; DALL-E 3
      </p>
      <p class="footer-sub">
        Progettazione interni AI · {{ current_year }}
      </p>
    </div>
  </footer>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>lucide.createIcons();</script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
